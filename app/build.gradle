
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.spiderai.v20'
    compileSdk 35

    defaultConfig {
        applicationId 'com.spiderai.v20'
        minSdk 26
        targetSdk 35
        versionCode 20
        versionName '20.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
